# 短视频发布台 · Nginx 反代（可选）
#
# ★ 先说清楚 Nginx 在这里**解决什么、不解决什么**：
#     解决：域名访问、HTTPS 卸载、统一入口
#     不解决：**鉴权**。认证在应用里（会话 Cookie），Nginx 只是把请求转过去。
#             所以 Nginx 配置里**不要**再开 basic auth 叠一层，除非你确实想要两层。
#
# ★ 容器里应用绑的是 0.0.0.0，且**没设访问口令会拒绝启动** —— 这道守卫在应用侧。

upstream shipin_fabu {
    server app:8947;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 视频上传可能很大（bilibili 允许 16GB），别让 Nginx 挡在前面
    client_max_body_size 0;
    client_body_timeout 600s;
    send_timeout 600s;

    # 发布/抓取是长任务：抓取要逐个平台开浏览器，一条请求可能跑几分钟
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 30s;

    # ── HTTPS（可选，放开下面几行并配好证书即可）──
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # return 301 https://$host$request_uri;   # 把 80 跳 443

    location / {
        proxy_pass http://shipin_fabu;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 视频拖动进度依赖 Range，必须透传
        proxy_set_header Range "";
        proxy_buffering off;
    }

    # 封面/截图/视频：直通，别缓冲（大文件缓冲会吃内存）
    location /api/videos/ {
        proxy_pass http://shipin_fabu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 上传接口：必须关掉请求缓冲，否则大视频会先全写进 Nginx 临时目录
    location /api/videos/upload {
        proxy_pass http://shipin_fabu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
    }
}
